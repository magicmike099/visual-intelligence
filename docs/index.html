<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Manif Map"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Paris Manif Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef0ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed street map, a floating route card on top, a pull-up sheet below. Paris street-sign blue as the one accent; protest severity as semantic colours. */
:root{
  --paper:#eef0ee; --block:#e3e6e2; --road:#ffffff; --road-edge:#cfd3cf; --major:#fbfbf7; --water:#b9d3e6; --rail:#9aa3ad;
  --ink:#1d2329; --ink-2:#55606b; --ink-3:#86909a; --line:#d7dbd8; --panel:#fbfcfb; --panel-2:#f2f4f2;
  --accent:#1f4e8c; --accent-ink:#ffffff;
  --sev-confirmed:#d4362c; --sev-likely:#e8731a; --sev-possible:#c99a06; --sev-banned:#7d3aa8; --sev-traffic:#2f7fb8;
  --route:#1f4e8c; --route-risk:#d4362c; --ok:#2d8a4e;
  --shadow:0 6px 24px rgba(20,30,40,.14),0 1px 3px rgba(20,30,40,.12);
  --f-display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161b20; --block:#1c2228; --road:#2c343c; --road-edge:#20272e; --major:#3a434c; --water:#1d3a52; --rail:#56606b;
  --ink:#e8ecef; --ink-2:#a9b3bc; --ink-3:#7c8792; --line:#2c343b; --panel:#1b2127; --panel-2:#232a31;
  --accent:#6c9ee0; --accent-ink:#0d1620; --route:#7fb0f0; --route-risk:#ff6b5e; --ok:#58c07f;
  --sev-confirmed:#ff5a4e; --sev-likely:#ff9440; --sev-possible:#e9c140; --sev-banned:#b47ae0; --sev-traffic:#5aa9e0;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161b20; --block:#1c2228; --road:#2c343c; --road-edge:#20272e; --major:#3a434c; --water:#1d3a52; --rail:#56606b;
  --ink:#e8ecef; --ink-2:#a9b3bc; --ink-3:#7c8792; --line:#2c343b; --panel:#1b2127; --panel-2:#232a31;
  --accent:#6c9ee0; --accent-ink:#0d1620; --route:#7fb0f0; --route-risk:#ff6b5e; --ok:#58c07f;
  --sev-confirmed:#ff5a4e; --sev-likely:#ff9440; --sev-possible:#e9c140; --sev-banned:#b47ae0; --sev-traffic:#5aa9e0;
  --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-map{overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate,.maplibregl-canvas-container.maplibregl-touch-drag-pan{touch-action:pan-x pan-y}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan{touch-action:none}
.maplibregl-control-container{display:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;top:10px;left:0;right:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;justify-content:center;z-index:5}
.card{pointer-events:auto;width:100%;max-width:520px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;margin:0;display:flex;align-items:center;gap:8px}
.plate{display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid color-mix(in srgb,var(--accent-ink) 60%,transparent)}
.fresh{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);text-align:right;line-height:1.3}
.fields{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.inputs{display:grid;gap:6px;min-width:0}
.field{position:relative;display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:9px;padding:0 6px 0 10px;min-width:0}
.field .dot{width:10px;height:10px;border-radius:50%;flex:none}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 0;outline:none}
.field input::placeholder{color:var(--ink-3)}
.pin{border:0;background:transparent;color:var(--ink-2);padding:6px;border-radius:7px;cursor:pointer;font-size:12px;white-space:nowrap}
.pin[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.swap{border:0;background:var(--panel-2);border-radius:9px;width:38px;cursor:pointer;color:var(--ink-2);font-size:18px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border-radius:10px;box-shadow:var(--shadow);z-index:20;max-height:260px;overflow:auto;padding:4px}
.sugg button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;gap:8px;align-items:baseline;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--panel-2)}
.sugg small{color:var(--ink-3);font-size:12px;margin-left:auto;white-space:nowrap}

.times{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.times::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.lbl{border:0;padding-left:0;padding-right:2px;color:var(--ink-3);cursor:default;font-size:12px;text-transform:uppercase;letter-spacing:.06em}

.ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:6px;z-index:4}
.ctl button{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;font-size:20px;line-height:1}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet-in{pointer-events:auto;width:100%;max-width:560px;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:46vh;transition:max-height .25s ease}
.sheet.min .sheet-in{max-height:118px}
.grab{border:0;background:transparent;padding:8px 0 2px;cursor:pointer;display:grid;place-items:center}
.grab span{width:40px;height:4px;border-radius:2px;background:var(--line)}
.tabs{display:flex;gap:2px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 10px 9px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--panel-2);border-radius:5px;padding:1px 5px;margin-left:4px;color:var(--ink-2)}
.body{overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.head{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:5px;padding:2px 6px;white-space:nowrap}
.sev i{width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.confirmed{color:var(--sev-confirmed);background:color-mix(in srgb,var(--sev-confirmed) 13%,transparent)}
.sev.likely{color:var(--sev-likely);background:color-mix(in srgb,var(--sev-likely) 13%,transparent)}
.sev.possible{color:var(--sev-possible);background:color-mix(in srgb,var(--sev-possible) 15%,transparent)}
.sev.banned{color:var(--sev-banned);background:color-mix(in srgb,var(--sev-banned) 13%,transparent)}
.sev.traffic{color:var(--sev-traffic);background:color-mix(in srgb,var(--sev-traffic) 13%,transparent)}
.zl{display:grid;gap:2px}
.zone{display:grid;grid-template-columns:4px 1fr;gap:10px;border:0;background:transparent;text-align:left;padding:8px 6px 8px 0;border-radius:8px;cursor:pointer;width:100%}
.zone:hover{background:var(--panel-2)}
.zone .bar{border-radius:2px}
.zone .t{font-weight:600;line-height:1.25}
.zone .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.zone.off{opacity:.5}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.res{display:grid;gap:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:3px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.opt .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.opt .v{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.opt .w{font-size:13px;font-weight:600}
.w.bad{color:var(--route-risk)} .w.good{color:var(--ok)}
.hits{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.hits li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.go{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:9px 13px;font-weight:600;text-decoration:none;border:0;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--panel-2);color:var(--ink)}
.note{font-size:13px;color:var(--ink-2);line-height:1.45;margin:0}
.note a{color:var(--accent)}
.box{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.stations{display:flex;flex-wrap:wrap;gap:6px}
.st{font-size:13px;background:var(--panel-2);border-radius:6px;padding:3px 7px}
.st b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--ink-3);margin-left:4px}
.here{position:absolute;left:50%;transform:translateX(-50%);z-index:7;max-width:min(92vw,420px);border:0;border-radius:12px;padding:9px 13px;font-weight:600;font-size:14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;background:var(--panel);color:var(--ink);display:flex;gap:8px;align-items:center}
.here .sev{flex:none}
.ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow);white-space:nowrap}
.pop{position:absolute;z-index:8;max-width:280px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:6px;font-size:14px}
.pop h3{margin:0;font-family:var(--f-display);font-size:16px;line-height:1.2}
.pop .x{position:absolute;top:4px;right:6px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--ink-3)}
.loading{position:absolute;inset:0;background:var(--paper);display:grid;place-items:center;color:var(--ink-2);z-index:2;font-family:var(--f-mono);font-size:12px}
@media (prefers-reduced-motion:reduce){.sheet-in{transition:none}}
@media (min-width:900px){
  .sheet{justify-content:flex-start;left:max(12px,env(safe-area-inset-left,0px));right:auto;bottom:12px;top:auto;width:400px}
  .sheet-in{border-radius:16px;max-height:calc(100vh - 220px)}
  .top{justify-content:flex-start}
  .card{max-width:400px}
}
</style>

<div id="app">
  <div id="map" aria-label="Map of Paris with protest zones"></div>
  <div class="loading" id="loading">Loading Paris streets…</div>

  <div class="top">
    <div class="card" id="card">
      <div class="brand">
        <h1><span class="plate">Paris</span> Manif Map</h1>
        <div class="fresh" id="fresh">Sat 17 Oct</div>
      </div>
      <div class="fields">
        <div class="inputs">
          <div class="field"><span class="dot" style="background:var(--ok)"></span>
            <input id="from" placeholder="From: street, station, place" autocomplete="off" aria-label="Start">
            <button class="pin" id="pinFrom" aria-pressed="false" title="Tap the map to set the start">Tap map</button>
            <div class="sugg" id="sFrom" hidden></div></div>
          <div class="field"><span class="dot" style="background:var(--route-risk)"></span>
            <input id="to" placeholder="To: street, station, place" autocomplete="off" aria-label="Destination">
            <button class="pin" id="pinTo" aria-pressed="false" title="Tap the map to set the destination">Tap map</button>
            <div class="sugg" id="sTo" hidden></div></div>
        </div>
        <button class="swap" id="swap" title="Swap start and destination" aria-label="Swap">⇅</button>
      </div>
      <div class="times" id="times" role="group" aria-label="Show the situation at"></div>
    </div>
  </div>

  <div class="ctl" id="ctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zfit" aria-label="Show protest area" title="Show protest area">◎</button>
    <button id="loc" aria-label="Show my location" title="My location" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-in">
      <button class="grab" id="grab" aria-label="Expand or collapse panel"><span></span></button>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="route" aria-selected="true">Route</button>
        <button class="tab" role="tab" data-tab="zones" aria-selected="false">Zones<span class="n" id="nz">0</span></button>
        <button class="tab" role="tab" data-tab="info" aria-selected="false">Transport &amp; sources</button>
      </div>
      <div class="body" id="body"></div>
    </div>
  </div>
  <button class="here" id="here" hidden></button>
  <div class="pop" id="pop" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="ml.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
let D=null, Z=null, map=null, mapReady=false;
let lastFetch=null;
const DAY='2026-10-17';
const TZ_OFFSET='+02:00';
const SEV_ORDER={confirmed:0,likely:1,banned:2,possible:3,traffic:4};
const SEV_LABEL={confirmed:'Confirmed',likely:'Likely',possible:'Possible',banned:'Banned route',traffic:'Traffic'};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={};
const COLOR_KEYS=['--paper','--block','--road','--road-edge','--major','--water','--rail','--ink','--ink-2','--ink-3','--panel','--route','--route-risk','--ok','--accent','--sev-confirmed','--sev-likely','--sev-possible','--sev-banned','--sev-traffic'];
function readColors(){COLOR_KEYS.forEach(k=>C[k]=css(k))}
readColors();

// ---------- time ----------
let tSel=null;
function nowMin(){return Math.round((new Date()-new Date(DAY+'T00:00:00'+TZ_OFFSET))/60000)}
function effMin(){return tSel==null?nowMin():tSel}
const hm=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
function zoneActive(z,t=effMin()){return t>=hm(z.start)&&t<=hm(z.end)}
function timeLabel(){return tSel!=null?'Sat '+String(Math.floor(tSel/60)).padStart(2,'0')+':'+String(tSel%60).padStart(2,'0'):'now'}
function buildTimes(){
  const el=$('#times');el.innerHTML='';
  const l=document.createElement('span');l.className='chip lbl';l.textContent='Show';el.appendChild(l);
  for(const [v,t] of [[null,'Now'],[12*60,'12:00'],[14*60,'14:00'],[15*60+30,'15:30'],[17*60,'17:00'],[18*60+30,'18:30'],[20*60,'20:00']]){
    const b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',String(v===tSel));
    b.onclick=()=>{tSel=v;buildTimes();computeRoute();updateZoneLayers()};el.appendChild(b);
  }
}
// Before Saturday, "now" shows nothing active, so open on the afternoon peak.
(function(){const n=nowMin();tSel=(n<10*60||n>23*60)?15*60+30:null})();

// ---------- geometry (local metres) ----------
function segDist2(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;const x=ax+t*dx-px,y=ay+t*dy-py;return x*x+y*y}
function distToZone(z,x,y){if(z.center)return Math.hypot(x-z.center[0],y-z.center[1]);let b=1e18;const p=z.path;for(let i=0;i<p.length-1;i++){const d=segDist2(x,y,p[i][0],p[i][1],p[i+1][0],p[i+1][1]);if(d<b)b=d}return Math.sqrt(b)}
function zoneBBox(z){const pts=z.center?[z.center]:z.path;let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const [x,y] of pts){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}const r=z.radius;return [a-r,b-r,c+r,d+r]}
let O=[2.3488,48.8534,73305,110574];
const LL=(x,y)=>[+(O[0]+x/O[2]).toFixed(6),+(O[1]+y/O[3]).toFixed(6)];
const XY=(lon,lat)=>[(lon-O[0])*O[2],(lat-O[1])*O[3]];

// ---------- street graph ----------
let NX,NY,EA,EB,EC,EN,GEO,GOFF,ELEN,ADJ,AOFF,nameCenters=new Map(),edgeZones=null;
function edgePts(i){const a=EA[i],b=EB[i];const out=[[NX[a],NY[a]]];for(let k=GOFF[i];k<GOFF[i+1];k++)out.push([GEO[2*k],GEO[2*k+1]]);out.push([NX[b],NY[b]]);return out}
function prepStreets(){
  O=D.origin;
  const n=D.nodes.length/2;NX=new Float32Array(n);NY=new Float32Array(n);
  for(let i=0;i<n;i++){NX[i]=D.nodes[2*i];NY[i]=D.nodes[2*i+1]}
  const m=D.edges.length/4;EA=new Int32Array(m);EB=new Int32Array(m);EC=new Uint8Array(m);EN=new Int32Array(m);ELEN=new Float32Array(m);
  for(let i=0;i<m;i++){EA[i]=D.edges[4*i];EB[i]=D.edges[4*i+1];EC[i]=D.edges[4*i+2];EN[i]=D.edges[4*i+3]}
  GEO=D.geo;GOFF=D.geoOff;
  const deg=new Int32Array(n+1);
  for(let i=0;i<m;i++){deg[EA[i]+1]++;deg[EB[i]+1]++;const p=edgePts(i);let l=0;for(let k=0;k<p.length-1;k++)l+=Math.hypot(p[k+1][0]-p[k][0],p[k+1][1]-p[k][1]);ELEN[i]=l}
  for(let i=0;i<n;i++)deg[i+1]+=deg[i];AOFF=deg.slice();ADJ=new Int32Array(2*m);const fill=deg.slice(0,n);

  const inp=$('#'+which),box=$('#s'+which[0].toUpperCase()+which.slice(1));let items=[],on=-1;
  const show=()=>{if(!D)return;items=search(inp.value);if(ME.pos&&which==='from'&&norm(inp.value).length<3)items=[{n:'My location',k:'GPS',x:ME.pos.xy[0],y:ME.pos.xy[1]}].concat(items);on=-1;if(!items.length){box.hidden=true;return}box.innerHTML='';items.forEach((it,i)=>{const b=document.createElement('button');b.innerHTML='<span></span><small></small>';b.firstChild.textContent=it.n;b.lastChild.textContent=it.k;b.onmousedown=ev=>ev.preventDefault();b.onclick=()=>pick(i);box.appendChild(b)});box.hidden=false};
  const pick=i=>{const it=items[i];box.hidden=true;inp.blur();setEnd(which,{n:it.n,x:it.x,y:it.y});focusRoute()};
  inp.addEventListener('input',show);inp.addEventListener('focus',()=>{if(inp.value)inp.select();show()});inp.addEventListener('blur',()=>setTimeout(()=>box.hidden=true,150));
  inp.addEventListener('keydown',e=>{if(box.hidden)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();on=(on+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;[...box.children].forEach((c,i)=>c.classList.toggle('on',i===on))}else if(e.key==='Enter'){e.preventDefault();pick(on<0?0:on)}else if(e.key==='Escape')box.hidden=true});
}
function updatePins(){$('#pinFrom').setAttribute('aria-pressed',String(S.pick==='from'));$('#pinTo').setAttribute('aria-pressed',String(S.pick==='to'));if(map)map.getCanvas().style.cursor=S.pick?'crosshair':''}
$('#pinFrom').onclick=()=>{S.pick=S.pick==='from'?null:'from';updatePins();if(S.pick)toast('Tap the map where you start')};
$('#pinTo').onclick=()=>{S.pick=S.pick==='to'?null:'to';updatePins();if(S.pick)toast('Tap the map where you are going')};
$('#swap').onclick=()=>{[S.from,S.to]=[S.to,S.from];$('#from').value=S.from?.n||'';$('#to').value=S.to?.n||'';computeRoute()};
$('#zin').onclick=()=>map&&map.zoomIn();$('#zout').onclick=()=>map&&map.zoomOut();$('#zfit').onclick=()=>fitZones(true);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.style.top=($('#card').getBoundingClientRect().bottom+10)+'px';clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function nearbyName(node){for(let k=AOFF[node];k<AOFF[node+1];k++){const e=ADJ[k];if(EN[e]>=0)return D.names[EN[e]]}return null}
function onMapClick(e){
  const [x,y]=XY(e.lngLat.lng,e.lngLat.lat);
  if(S.pick){const which=S.pick;S.pick=null;updatePins();const node=nearestNode(x,y);setEnd(which,{n:nearbyName(node)||'Dropped pin',x:NX[node],y:NY[node]});return}
  if(!Z)return;const t=effMin();const tol=12*156543.03*Math.cos(48.86*Math.PI/180)/2**map.getZoom();let best=-1,bd=1e9;
  Z.zones.forEach((z,i)=>{const d=distToZone(z,x,y)-z.radius;const sc=d+(zoneActive(z,t)?0:200);if(d<tol&&sc<bd){bd=sc;best=i}});
  if(best>=0)openPop(best);else closePop();
}

// ---------- sheet ----------
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('#sheet').classList.remove('min');render()});
$('#grab').onclick=()=>$('#sheet').classList.toggle('min');
const fmtLen=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
const fmtMin=m=>{const t=Math.max(1,Math.round(m/1000/4.8*60));return t<60?t+' min':Math.floor(t/60)+' h '+String(t%60).padStart(2,'0')};
function gmapsUrl(r,mode){
  const o=LL(...r.pts[0]).reverse(),d=LL(...r.pts[r.pts.length-1]).reverse();
  let u=`https://www.google.com/maps/dir/?api=1&origin=${o.join(',')}&destination=${d.join(',')}&travelmode=${mode}`;
  if(mode==='walking'&&r.pts.length>10){const w=[];for(let i=1;i<=4;i++)w.push(LL(...r.pts[Math.floor(i*(r.pts.length-1)/5)]).reverse().join(','));u+='&waypoints='+encodeURIComponent(w.join('|'))}
  return u;
}
function hitList(r){const t=effMin();return [...r.hits.entries()].map(([z,l])=>({z:Z.zones[z],l,on:zoneActive(Z.zones[z],t)})).filter(h=>h.on&&h.z.status!=='traffic').sort((a,b)=>SEV_ORDER[a.z.status]-SEV_ORDER[b.z.status])}
function viaText(r){return [...r.via.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>D.names[k]).join(', ')}
function render(){
  const b=$('#body');if(!Z){b.innerHTML='<p class="note">Loading zones…</p>';return}
  const t=effMin();const active=Z.zones.filter(z=>zoneActive(z,t)).length;$('#nz').textContent=active;
  if(S.tab==='route'){
    if(!S.res){b.innerHTML=`<p class="head">${esc(Z.headline)}</p><p class="note">Pick a start and destination above, or press <b>Tap map</b> and tap a spot. The app compares the direct walking route with one that steers around active zones at <b>${timeLabel()}</b>.</p><div class="legend">${['confirmed','likely','possible','banned','traffic'].map(k=>`<span class="sev ${k}"><i></i>${SEV_LABEL[k]}</span>`).join('')}</div>`;return}
    const {fast,safe}=S.res;if(!fast){b.innerHTML='<p class="note">No walking route found between these points. Try a nearby street.</p>';return}
    const fh=hitList(fast),sh=safe?hitList(safe):[];const same=!safe||Math.abs(safe.len-fast.len)<5;
    const opt=(k,r,h,label)=>`<button class="opt" data-c="${k}" aria-pressed="${S.choice===k||same}"><span class="k">${label}</span><span class="v">${fmtMin(r.len)}</span><span class="mono muted">${fmtLen(r.len)}</span><span class="w ${h.length?'bad':'good'}">${h.length?`Crosses ${h.length} zone${h.length>1?'s':''}`:'Clear of zones'}</span></button>`;
    const cur=S.choice==='safe'&&!same?safe:fast,ch=S.choice==='safe'&&!same?sh:fh;
    b.innerHTML=`<div class="res">
      ${same?`<div class="opts" style="grid-template-columns:1fr">${opt('fast',fast,fh,fh.length?'Walking route (no detour possible)':'Walking route')}</div>`:`<div class="opts">${opt('fast',fast,fh,'Direct')}${opt('safe',safe,sh,'Avoids zones')}</div>`}
      <p class="note">Via ${esc(viaText(cur))||'local streets'}. Situation at <b>${timeLabel()}</b>.</p>
      ${ch.length?`<ul class="hits">${ch.map(h=>`<li><span class="sev ${h.z.status}"><i></i>${SEV_LABEL[h.z.status]}</span><span>${esc(h.z.title)} <span class="mono muted">${h.z.start}–${h.z.end}</span></span></li>`).join('')}</ul>`:''}
      <div class="go"><a class="btn pri" target="_blank" rel="noopener" href="${gmapsUrl(cur,'walking')}">Open walk in Google Maps</a><a class="btn sec" target="_blank" rel="noopener" href="${gmapsUrl(cur,'transit')}">Metro &amp; bus options</a></div>
      <p class="note small">Google Maps gets a few points along this route so it follows the same path. For the metro, check the closures in the Transport tab first.</p></div>`;
    b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{S.choice=o.dataset.c;render();updateRouteLayers()});
  } else if(S.tab==='zones'){
    const zs=Z.zones.map((z,i)=>({z,i,on:zoneActive(z,t)})).sort((a,b)=>(b.on-a.on)||SEV_ORDER[a.z.status]-SEV_ORDER[b.z.status]||hm(a.z.start)-hm(b.z.start));
    b.innerHTML=`<p class="note">${active} active at <b>${timeLabel()}</b>. Tap a zone to see it on the map.</p><div class="zl">${zs.map(({z,i,on})=>`<button class="zone ${on?'':'off'}" data-i="${i}"><span class="bar" style="background:var(--sev-${z.status})"></span><span><span class="t"></span><span class="m"><span class="sev ${z.status}"><i></i>${SEV_LABEL[z.status]}</span><span class="mono muted">${z.start}–${z.end}</span></span></span></button>`).join('')}</div>`;
    b.querySelectorAll('.zone').forEach(el=>{const i=+el.dataset.i,z=Z.zones[i];el.querySelector('.t').textContent=z.title;el.onclick=()=>{const bx=zoneBBox(z);fitXY(bx[0]-150,bx[1]-150,bx[2]+150,bx[3]+150);map.once('moveend',()=>openPop(i))}});
  } else {
    b.innerHTML=`<div class="box"><p class="head" style="font-size:15px">Métro stations that may close</p><div class="stations">${Z.stations.map(s=>`<span class="st">${esc(s.name)}<b>${esc(s.lines)}</b></span>`).join('')}</div><p class="note">${esc(Z.stationNote)}</p></div>
    <p class="note">${esc(Z.traffic)}</p>
    <div class="box"><p class="head" style="font-size:15px">How to read this map</p><p class="note"><b>Confirmed</b> and <b>likely</b> come from organisers' calls and press reports. <b>Possible</b> marks routes the prefecture proposed or organisers asked for that were not agreed. <b>Banned</b> routes are where police expect to block gatherings. Lines are drawn along the most plausible streets; the official route had not been published when this was last updated.</p></div>
    <p class="note">Check before leaving: <a href="https://www.prefecturedepolice.interieur.gouv.fr/" target="_blank" rel="noopener">Préfecture de police</a> (official route), <a href="https://www.ratp.fr/infos-trafic" target="_blank" rel="noopener">RATP traffic info</a>, <a href="https://www.sytadin.fr/" target="_blank" rel="noopener">Sytadin</a> (roads).</p>
    <p class="note small">Sources: ${Object.values(Z.sources).map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')}. Map: MapLibre, street data © OpenStreetMap contributors via Overture Maps.</p>`;
  }
}
function freshText(){if(!Z)return;const f=d=>d.toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});$('#fresh').innerHTML=`Updated ${f(new Date(Z.updated))}<br>checked ${lastFetch?lastFetch.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}):'—'}`}

// ---------- my location (only where the browser allows it, i.e. the installed app) ----------
const ME={pos:null,watch:null,follow:false};
function meGeoJSON(){if(!ME.pos)return empty();const [x,y]=ME.pos.xy;return {type:'FeatureCollection',features:[{type:'Feature',properties:{acc:ME.pos.acc},geometry:{type:'Point',coordinates:LL(x,y)}}]}}
function addMeLayers(){map.addSource('me',{type:'geojson',data:empty()});
  map.addLayer({id:'me-acc',type:'circle',source:'me',paint:{'circle-radius':['interpolate',['exponential',2],['zoom'],10,['/',['get','acc'],MPP0/2048],20,['/',['get','acc'],MPP0/2097152]],'circle-color':C['--accent'],'circle-opacity':.14,'circle-pitch-alignment':'map'}});
  map.addLayer({id:'me',type:'circle',source:'me',paint:{'circle-radius':8,'circle-color':C['--accent'],'circle-stroke-color':'#ffffff','circle-stroke-width':3}})}
function nearestActiveZone(x,y){if(!Z)return null;const t=effMin();let best=null;
  Z.zones.forEach((z,i)=>{if(z.status==='traffic'||!zoneActive(z,t))return;const d=distToZone(z,x,y)-z.radius;if(!best||d<best.d)best={z,i,d}});return best}
function updateHere(){const el=$('#here');if(!ME.pos){el.hidden=true;return}
  const n=nearestActiveZone(...ME.pos.xy);if(!n||n.d>400){el.hidden=true;return}
  const inside=n.d<=0;el.innerHTML=`<span class="sev ${n.z.status}"><i></i>${inside?'You are in':'Nearby'}</span><span></span>`;
  el.lastChild.textContent=inside?n.z.title:`${n.z.title}, ${Math.max(10,Math.round(n.d/10)*10)} m away`;
  el.style.top=($('#card').getBoundingClientRect().bottom+10)+'px';el.hidden=false;el.onclick=()=>openPop(n.i)}
function onFix(p){const xy=XY(p.coords.longitude,p.coords.latitude);ME.pos={xy,acc:Math.max(8,p.coords.accuracy||30)};
  if(mapReady)map.getSource('me').setData(meGeoJSON());updateHere();
  if(ME.follow&&mapReady)map.easeTo({center:LL(...xy),duration:500})}
function startLocate(){
  if(!('geolocation' in navigator)){toast('Location is not available here. Open the installed app.');return}
  if(ME.watch!=null){ME.follow=true;$('#loc').setAttribute('aria-pressed','true');if(ME.pos&&mapReady)map.easeTo({center:LL(...ME.pos.xy),zoom:Math.max(map.getZoom(),15.5),duration:600});return}
  try{ME.watch=navigator.geolocation.watchPosition(p=>{const first=!ME.pos;onFix(p);if(first&&mapReady&&ME.follow)map.easeTo({center:LL(...ME.pos.xy),zoom:Math.max(map.getZoom(),15.5),duration:600})},
    e=>{ME.watch=null;ME.follow=false;$('#loc').setAttribute('aria-pressed','false');toast(e.code===1?'Location is blocked. Allow it in your browser settings.':'Location is not available here. Open the installed app.')},
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});ME.follow=true;$('#loc').setAttribute('aria-pressed','true')}
  catch(e){toast('Location is not available here. Open the installed app.')}}
$('#loc').onclick=startLocate;

// ---------- loading & refresh ----------
async function loadZones(){
  try{const r=await fetch('zones.json',{cache:'no-store'});if(!r.ok)throw 0;const z=await r.json();const changed=!Z||z.updated!==Z.updated;Z=z;lastFetch=new Date();
    if(changed&&D){computeEdgeZones();buildIndex();updateZoneLayers();computeRoute()}freshText();render()}
  catch(e){toast(navigator.onLine?'Could not refresh zones. Showing the last version.':'Offline. Showing the zones saved at '+(lastFetch?lastFetch.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}):'last visit'))}
}
setInterval(loadZones,30*60*1000);setInterval(()=>{updateHere();updateZoneLayers()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastFetch&&Date.now()-lastFetch>10*60*1000)loadZones()});
async function boot(){
  buildTimes();placeCtl();render();
  map=new maplibregl.Map({container:'map',style:buildStyle(),center:[2.362,48.862],zoom:12.6,minZoom:10.5,maxZoom:18.5,maxBounds:[[2.15,48.76],[2.55,48.95]],attributionControl:false,dragRotate:false,pitchWithRotate:false,fadeDuration:150});
  map.touchZoomRotate.disableRotation();
  map.on('click',onMapClick);map.on('dragstart',()=>{ME.follow=false;$('#loc').setAttribute('aria-pressed','false')});map.on('move',placePop);
  const styleLoaded=new Promise(r=>map.once('load',r));
  const [d]=await Promise.all([fetch('paris.json').then(r=>r.json()),loadZones(),styleLoaded]);
  D=d;prepStreets();computeEdgeZones();buildIndex();addLayers();addMeLayers();mapReady=true;if(ME.pos)map.getSource('me').setData(meGeoJSON());
  const ex=n=>IDX.find(i=>i.n===n);const a=ex('Gare de Lyon'),b=ex("Gare de l'Est");
  if(a&&b&&!S.from&&!S.to){S.from={n:a.n,x:a.x,y:a.y};S.to={n:b.n,x:b.x,y:b.y};$('#from').value=a.n+' (example)';$('#to').value=b.n}
  computeRoute();if(S.res)focusRoute(false);else fitZones(false);
  map.once('idle',()=>$('#loading').hidden=true);
}
wireInput('from');wireInput('to');
if('serviceWorker' in navigator&&window.isSecureContext&&document.querySelector('link[rel=manifest]')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
if(!window.maplibregl){$('#loading').textContent='The map library did not load. Check your connection and reload.'}
else boot().catch(e=>{$('#loading').textContent='Could not load the map data. Reload the page.';console.error(e)});
})();
</script>
</body></html>
